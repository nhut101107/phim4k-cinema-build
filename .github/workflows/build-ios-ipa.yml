name: Build 4K unsigned IPA

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: Public HTTPS origin of the 4K API (for example https://api.example.com)
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-ios:
    name: Build unsigned iPhone IPA
    # macos-13 was retired from GitHub-hosted runners. Use the supported
    # Intel image so the iPhone SDK build remains compatible with this
    # Capacitor project.
    runs-on: macos-15-intel
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Verify iOS shell inputs
        run: npm run ios:verify

      - name: Prepare native web bundle
        run: npm run ios:prepare

      - name: Set public API origin for this build
        env:
          PHIM4K_API_BASE_URL: ${{ inputs.api_base_url }}
        run: node scripts/set-mobile-api-url.js

      - name: Sync Capacitor iOS project
        run: npx cap sync ios

      - name: Seal native web assets into the release binary
        run: npm run ios:integrity

      - name: Build unsigned iPhone application
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package and validate IPA
        shell: bash
        run: |
          set -euo pipefail
          app_path="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/App.app"
          test -d "$app_path"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app_path/Info.plist")" = "com.phim4k.cinema"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$app_path/Info.plist")" = "4K"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app_path/Info.plist")" = "3.4.35"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app_path/Info.plist")" = "35"
          package_dir="$RUNNER_TEMP/phim4k-ipa"
          mkdir -p "$package_dir/Payload"
          cp -R "$app_path" "$package_dir/Payload/App.app"
          (cd "$package_dir" && /usr/bin/zip -qry "$GITHUB_WORKSPACE/4K-iOS-3.4.35-unsigned.ipa" Payload)
          /usr/bin/unzip -t "$GITHUB_WORKSPACE/4K-iOS-3.4.35-unsigned.ipa"
          python3 scripts/package_ios_web_update.py --audit-only "$GITHUB_WORKSPACE/4K-iOS-3.4.35-unsigned.ipa"

      - name: Upload unsigned IPA for ESign
        uses: actions/upload-artifact@v4
        with:
          name: 4K-iOS-3.4.35-unsigned
          path: 4K-iOS-3.4.35-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
