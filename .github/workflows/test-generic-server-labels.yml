name: Test generic server labels

on:
  push:
    branches: [hide-provider-server-labels]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --check backend-worker/src/worker.mjs
      - run: npm test
