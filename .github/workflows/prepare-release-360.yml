name: Prepare MNHUT Cinema 3.60 release

on:
  push:
    branches: [main]
    paths:
      - scripts/rebuild-release.flag
      - .github/workflows/prepare-release-360.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prepare-phim4k-360-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create the draft before platform builders upload files
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view ios-v3.60 --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo 'Draft release already exists.'
          else
            gh release create ios-v3.60 \
              --repo "${GITHUB_REPOSITORY}" \
              --draft \
              --target "${GITHUB_SHA}" \
              --title 'MNHUT Cinema 3.60 - iOS, Android, Android TV, Windows' \
              --notes 'Căn giữa chính xác khung phát ENSMovie 16:9 khi điện thoại đang dọc; xoay ngang vẫn phát tràn màn hình. Loại bỏ lỗi hình và điều khiển bị dồn lên góc trên trên web lẫn app. Giữ duy nhất luồng phát ENSMovie. iOS IPA chưa ký.'
          fi
          gh release view ios-v3.60 --repo "${GITHUB_REPOSITORY}" --json isDraft,tagName \
            --jq '{tag: .tagName, draft: .isDraft}'
