name: Prepare MNHUT Cinema 3.58 release

on:
  push:
    branches: [main]
    paths:
      - scripts/rebuild-release.flag
      - .github/workflows/prepare-release-358.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prepare-phim4k-358-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create the draft before platform builders upload files
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view ios-v3.58 --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo 'Draft release already exists.'
          else
            gh release create ios-v3.58 \
              --repo "${GITHUB_REPOSITORY}" \
              --draft \
              --target "${GITHUB_SHA}" \
              --title 'MNHUT Cinema 3.58 - iOS, Android, Android TV, Windows' \
              --notes 'Thêm nút Lấp đầy cho ENSMovie, vùng an toàn tự thích nghi tai thỏ/cạnh bo mọi thiết bị, giảm khựng khi chạm, ghi đúng thời gian xem, IP mạng thật và nút nhắn tin trả lời User rõ ràng. Giữ duy nhất luồng phát ENSMovie. iOS IPA chưa ký.'
          fi
          gh release view ios-v3.58 --repo "${GITHUB_REPOSITORY}" --json isDraft,tagName \
            --jq '{tag: .tagName, draft: .isDraft}'
