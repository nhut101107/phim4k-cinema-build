name: Prepare 4K Cinema 3.52 release

on:
  push:
    branches: [main]
    paths:
      - scripts/rebuild-release.flag
      - .github/workflows/prepare-release-352.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prepare-phim4k-352-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create the draft before platform builders upload files
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view ios-v3.52 --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo 'Draft release already exists.'
          else
            gh release create ios-v3.52 \
              --repo "${GITHUB_REPOSITORY}" \
              --draft \
              --target "${GITHUB_SHA}" \
              --title '4K Cinema 3.52 - iOS, Android, Android TV, Windows' \
              --notes 'Tự động ẩn phim khi toàn bộ nguồn phát đã chết, quét lại mỗi 15 phút để phục hồi phim khi nguồn hoạt động trở lại, và giữ chuyển server nhanh. iOS IPA chưa ký và cần chứng chỉ của người dùng.'
          fi
          gh release view ios-v3.52 --repo "${GITHUB_REPOSITORY}" --json isDraft,tagName \
            --jq '{tag: .tagName, draft: .isDraft}'
