name: Test EnsMovie source core port

on:
  push:
    branches: [ensmovie-source-core-port]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Syntax
        run: |
          node --check backend-worker/src/worker.mjs
          node --check public/js/player.js
          node --check public/js/player-core.js
      - name: Full regression suite
        run: npm test
