name: Verify live app downloads
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-live-downloads.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check production app release manifest and update endpoints
        shell: bash
        run: |
          python3 - <<'PY'
          import json, time, urllib.parse, urllib.request, urllib.error
          origin='https://phim4k-license-api.phim4k-pwdbhdz.workers.dev'
          releases={
              'android':('/download/android',4082889,'57a85ddbec9727ffb0c61169ffd3a91406202fdd9eef810368c67ec3452b56aa'),
              'android_tv':('/download/android-tv',4082889,'97eb335655dd6cbae00ee65cd1b5e1aa2269dc9707038aac6298fa2f2080a71e'),
              'ios':('/download/ios',4537950,'e5822b0c3c73dfa52ec5a952da13c81bc32738efa15d3a45ca5bf28eeba8ceec'),
              'windows':('/download/windows',121064854,'95322969003514810affe13704011557adea2d99f43833d045ab00e35fb7fb30'),
          }
          def get(path):
            for attempt in range(4):
              try:
                with urllib.request.urlopen(urllib.request.Request(origin+path,headers={'Accept':'application/json','User-Agent':'MNHUT-Cinema-Release-QA/3.61'}),timeout=25) as r:
                  print('HTTP',path,r.status,r.headers.get('content-type'),flush=True)
                  assert r.status==200,(path,r.status)
                  return json.load(r)
              except urllib.error.HTTPError as error:
                details=error.read(220).decode('utf-8','replace').replace('\n',' ')
                print('HTTP ERROR',path,error.code,'type=',error.headers.get('content-type'),'server=',error.headers.get('server'),'ray=',error.headers.get('cf-ray'),'body=',details,flush=True)
                if attempt==3:raise
                time.sleep(3)
              except Exception as error:
                print('FETCH ERROR',path,type(error).__name__,str(error),flush=True)
                if attempt==3:raise
                time.sleep(3)
          manifest=get('/api/app/downloads')
          for platform,(download_path,size,sha) in releases.items():
            entry=manifest[platform]
            url=urllib.parse.urlsplit(entry['url'])
            assert url.hostname=='phim4k-license-api.phim4k-pwdbhdz.workers.dev',(platform,url.hostname)
            assert url.path==download_path,(platform,url.path)
            assert url.query=='build=42',(platform,url.query)
            assert entry['version']=='3.61',platform
            assert entry['sha256']==sha,platform
            assert entry['sizeBytes']==size,platform
            print('PASS live app downloads:',platform,'v3.61 first-party route, size, SHA-256',flush=True)
            status=get('/api/app/check-update?'+urllib.parse.urlencode({'platform':platform,'version':'3.59'}))
            assert status['latestVersion']=='3.61',(platform,status)
            assert status['downloadSha256']==sha,platform
            assert status['downloadSizeBytes']==size,platform
            print('PASS live check-update:',platform,flush=True)
          print('PASS all 4 production release and update endpoints',flush=True)
          PY
