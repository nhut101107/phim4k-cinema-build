name: Verify live app downloads
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-live-downloads.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check production app release manifest and update endpoints
        shell: bash
        run: |
          python3 - <<'PY'
          import json, time, urllib.parse, urllib.request, urllib.error
          origin='https://phim4k-license-api.phim4k-pwdbhdz.workers.dev'
          releases={
            'android':('1cIKz4nVb1ODD5TFqRx_yxc6bn02QB8pS',3967808,'78e0a673bf61f61bb78d5971e3a3c6986bd199fedacc89a5f24c5aded5f56325'),
            'android_tv':('132cxRcOetx_AsOm6m9vgDFoVJCZOwWhs',3967808,'5d8335f77144aebbaf882992351b7a059857a932e781c335d0375769dcf148a8'),
            'ios':('14AOZdrCewKFU2Rn52oySmgXNqQiWzNW_',4424082,'94959219094d568eb8722db148fceac88f66d1c297a1f6d562f579ca51ab99c0'),
            'windows':('github-release',120969742,'ec1fc094ca880b412b175db973187cb37af4f71100a15e3c1463b8fc159c0e84'),
          }
          def get(path):
            for attempt in range(4):
              try:
                with urllib.request.urlopen(urllib.request.Request(origin+path,headers={'Accept':'application/json','User-Agent':'4K-Cinema-Release-QA/3.56'}),timeout=25) as r:
                  print('HTTP',path,r.status,r.headers.get('content-type'),flush=True)
                  assert r.status==200,(path,r.status)
                  return json.load(r)
              except urllib.error.HTTPError as error:
                details=error.read(220).decode('utf-8','replace').replace('\n',' ')
                print('HTTP ERROR',path,error.code,'type=',error.headers.get('content-type'),'server=',error.headers.get('server'),'ray=',error.headers.get('cf-ray'),'body=',details,flush=True)
                if attempt==3:raise
                time.sleep(3)
              except Exception as error:
                print('FETCH ERROR',path,type(error).__name__,str(error),flush=True)
                if attempt==3:raise
                time.sleep(3)
          manifest=get('/api/app/downloads')
          for platform,(file_id,size,sha) in releases.items():
            entry=manifest[platform]
            url=urllib.parse.urlsplit(entry['url'])
            if platform == 'windows':
              assert url.hostname=='github.com',(platform,url.hostname)
              assert url.path.endswith('/4K-Cinema-Windows-3.56-x64.exe'),url.path
            else:
              assert url.hostname=='drive.usercontent.google.com',(platform,url.hostname)
              assert urllib.parse.parse_qs(url.query).get('id')==[file_id],platform
            assert entry['version']=='3.56',platform
            assert entry['sha256']==sha,platform
            assert entry['sizeBytes']==size,platform
            print('PASS live app downloads:',platform,'v3.56 Drive URL, size, SHA-256',flush=True)
            status=get('/api/app/check-update?'+urllib.parse.urlencode({'platform':platform,'version':'3.55'}))
            assert status['latestVersion']=='3.56',(platform,status)
            assert status['downloadSha256']==sha,platform
            assert status['downloadSizeBytes']==size,platform
            print('PASS live check-update:',platform,flush=True)
          print('PASS all 4 production release and update endpoints',flush=True)
          PY