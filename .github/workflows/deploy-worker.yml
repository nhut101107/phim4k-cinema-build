name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - 'backend-worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-phim4k-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo '::error::Worker was NOT deployed. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID under GitHub Settings > Secrets and variables > Actions, then rerun this workflow.'
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Verify Worker entry syntax
        run: node --check backend-worker/src/worker-entry.mjs

      - name: Run Worker regression tests
        run: node --test backend-worker/test/*.test.mjs

      - name: Apply idempotent movie availability schema
        run: npx wrangler d1 execute phim4k-license --remote --config backend-worker/wrangler.toml --file=backend-worker/migrations/0003_movie_availability.sql

      - name: Deploy Worker
        run: npx wrangler deploy --config backend-worker/wrangler.toml

      - name: Verify live Worker is ready
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-delay 2 --max-time 20 \
            'https://phim4k-license-api.phim4k-pwdbhdz.workers.dev/api/health' \
            | node -e 'let body="";process.stdin.on("data",chunk=>body+=chunk);process.stdin.on("end",()=>{const result=JSON.parse(body);if(result.service!=="phim4k-license-api"||result.ready!==true){console.error("Worker health check did not report ready");process.exitCode=1;}})'
