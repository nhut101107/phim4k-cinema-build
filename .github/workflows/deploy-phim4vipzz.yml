name: Deploy Phim4VIPzz Cloudflare Pages

on:
  push:
    branches: [main, phim-4k-vip-4.0, ensmovie-web-preview-vip4]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-phim4vipzz
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_PROJECT: phim4vipzz

    steps:
      - name: Check Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"

      - name: Check out source
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --ignore-scripts
      - run: node --check public/_worker.js

      - name: Ensure Pages project exists
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/pages-project.json -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PAGES_PROJECT")"
          if [ "$code" != "200" ]; then
            curl --fail --silent --show-error \
              -X POST \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data "{\"name\":\"$PAGES_PROJECT\",\"production_branch\":\"main\"}" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects" \
              > /tmp/pages-create.json
            node -e "const r=require('/tmp/pages-create.json');if(!r.success){console.error(r.errors);process.exit(1)}"
          fi

      - name: Deploy Pages
        run: npx wrangler pages deploy public --project-name="$PAGES_PROJECT" --branch=main --commit-dirty=true

      - name: Verify live
        shell: bash
        run: |
          set -euo pipefail
          base="https://$PAGES_PROJECT.pages.dev"
          curl --fail --silent --show-error --retry 8 --retry-delay 5 --max-time 20 "$base/__web/health" || true
          echo "Successfully deployed to: https://$PAGES_PROJECT.pages.dev"
