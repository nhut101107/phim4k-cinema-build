name: Deploy Phim 4K VIP 4.0 to Cloudflare Pages

on:
  push:
    branches: [phim-4k-vip-4.0]
    paths:
      - 'public/**'
      - '.github/workflows/deploy-pages-vip-4.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-phim-4k-vip-4-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_PROJECT: phim-4k-vip-4-0

    steps:
      - name: Check Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Verify Pages worker syntax
        run: node --check public/_worker.js

      - name: Ensure Pages project exists
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/pages-project.json -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PAGES_PROJECT")"
          if [ "$code" = "200" ]; then
            echo "Pages project already exists."
            exit 0
          fi
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data "{\"name\":\"$PAGES_PROJECT\",\"production_branch\":\"phim-4k-vip-4.0\"}" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects" \
            > /tmp/pages-create.json
          node -e "const r=require('/tmp/pages-create.json'); if(!r.success){console.error(r.errors);process.exit(1)}"

      - name: Deploy Pages
        run: npx wrangler pages deploy public --project-name="$PAGES_PROJECT" --branch=phim-4k-vip-4.0 --commit-dirty=true

      - name: Verify live web app
        shell: bash
        run: |
          set -euo pipefail
          base="https://$PAGES_PROJECT.pages.dev"
          curl --fail --silent --show-error --retry 6 --retry-delay 5 --max-time 20 "$base/__web/health" \
            | node -e 'let b="";process.stdin.on("data",c=>b+=c);process.stdin.on("end",()=>{const j=JSON.parse(b);if(j.app!=="Phim 4K VIP 4.0"||j.ok!==true)process.exit(1)})'
          curl --fail --silent --show-error --retry 6 --retry-delay 5 --max-time 20 "$base/" \
            | grep -F '<title>Phim 4K VIP 4.0</title>'
