name: Test VIP4 web playback fix

on:
  push:
    branches: [fix-vip4-web-playback]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --check backend-worker/src/worker.mjs
      - run: node --check public/js/api.js
      - run: npm test
