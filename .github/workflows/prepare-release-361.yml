name: Prepare MNHUT Cinema 3.61 release

on:
  push:
    branches: [main]
    paths:
      - scripts/rebuild-release.flag
      - .github/workflows/prepare-release-361.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prepare-phim4k-361-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create the draft before platform builders upload files
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view ios-v3.61 --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo 'Draft release already exists.'
          else
            gh release create ios-v3.61 \
              --repo "${GITHUB_REPOSITORY}" \
              --draft \
              --target "${GITHUB_SHA}" \
              --title 'MNHUT Cinema 3.61 - iOS, Android, Android TV, Windows' \
              --notes 'Loại phim chỉ có metadata nhưng không có luồng ENSMovie khỏi danh sách; tự thử lại chi tiết phim không qua cache khi nguồn chập chờn; giữ khung ENSMovie 16:9 ở chính giữa màn hình dọc và vùng chạm khôi phục điều khiển ổn định trên web lẫn app. iOS IPA chưa ký.'
          fi
          gh release view ios-v3.61 --repo "${GITHUB_REPOSITORY}" --json isDraft,tagName \
            --jq '{tag: .tagName, draft: .isDraft}'
