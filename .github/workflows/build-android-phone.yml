name: Build Android Phone
on: workflow_dispatch
permissions:
  contents: read

jobs:
  android-phone:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev
      - run: npm test
      - run: npm run android:sync
      - run: npm run security:audit
      - name: Build phone release and QA APKs
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :app:assemblePhoneRelease :app:assemblePhoneDebug :app:assemblePhoneDebugAndroidTest --no-daemon
      - name: Sign and verify phone APK
        env:
          ANDROID_KEYSTORE: ${{ secrets.PHIM4K_TV_KEYSTORE }}
          ANDROID_STORE_PASSWORD: ${{ secrets.PHIM4K_TV_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE"
          trap 'rm -f "$RUNNER_TEMP/android.jks"' EXIT
          printf '%s' "$ANDROID_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/android.jks"
          chmod 600 "$RUNNER_TEMP/android.jks"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -p -f 4 android/app/build/outputs/apk/phone/release/app-phone-release-unsigned.apk "$RUNNER_TEMP/phone-aligned.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$RUNNER_TEMP/android.jks" --ks-key-alias phim4k-tv --ks-pass env:ANDROID_STORE_PASSWORD --out 4K-Cinema-Android-3.4.39.apk "$RUNNER_TEMP/phone-aligned.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs 4K-Cinema-Android-3.4.39.apk | tee "$RUNNER_TEMP/phone-cert.txt"
          grep -qi 'ABAFDA2EAD9478B2540328C98774B4B0A9432014F7B31CBF40FB3EF1F6FECBC8' "$RUNNER_TEMP/phone-cert.txt"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging 4K-Cinema-Android-3.4.39.apk | grep "package: name='com.phim4k.cinema'.*versionCode='39'.*versionName='3.4.39'"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging 4K-Cinema-Android-3.4.39.apk | grep "application-label:'4K Cinema'"
          python3 scripts/package_ios_web_update.py --audit-only 4K-Cinema-Android-3.4.39.apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          disable-animations: true
          script: cd android && ./gradlew :app:connectedPhoneDebugAndroidTest --no-daemon
      - name: Phone QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-phone-test-results
          path: android/app/build/reports/androidTests/
      - uses: actions/upload-artifact@v4
        with:
          name: 4K-Cinema-Android-3.4.39
          path: 4K-Cinema-Android-3.4.39.apk
          if-no-files-found: error
