name: Build TV and Windows
on: workflow_dispatch
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run desktop:build
      - shell: pwsh
        run: |
          $p = Start-Process -FilePath '.\builds\windows-3.4.14\win-unpacked\Phim4K Cinema.exe' -ArgumentList '--smoke-test' -WindowStyle Hidden -PassThru
          if (!$p.WaitForExit(60000)) { $p.Kill(); throw 'Desktop smoke timed out' }
          if ($p.ExitCode -ne 0) { throw 'Desktop smoke failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: Phim4K-Windows
          path: builds/windows-3.4.14/Phim4K-Windows-3.4.14-x64.exe
          if-no-files-found: error
  android-tv:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run tv:sync
      - name: Build release and QA APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon
      - name: Sign release
        env:
          TV_KEYSTORE: ${{ secrets.PHIM4K_TV_KEYSTORE }}
          TV_STORE_PASSWORD: ${{ secrets.PHIM4K_TV_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$TV_KEYSTORE"
          trap 'rm -f "$RUNNER_TEMP/tv.jks"' EXIT
          printf '%s' "$TV_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/tv.jks"
          chmod 600 "$RUNNER_TEMP/tv.jks"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/tv-aligned.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$RUNNER_TEMP/tv.jks" --ks-key-alias phim4k-tv --ks-pass env:TV_STORE_PASSWORD --out Phim4K-Android-TV-3.4.14.apk "$RUNNER_TEMP/tv-aligned.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose Phim4K-Android-TV-3.4.14.apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: android-tv
          arch: x86
          disable-animations: true
          script: cd android && ./gradlew :app:connectedDebugAndroidTest --no-daemon
      - name: QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TV-test-results
          path: android/app/build/reports/androidTests/
      - uses: actions/upload-artifact@v4
        with:
          name: Phim4K-Android-TV
          path: Phim4K-Android-TV-3.4.14.apk
          if-no-files-found: error
