name: Test EnsMovie reliability port

on:
  push:
    branches: [ensmovie-reliability-port]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check modified JavaScript syntax
        run: |
          node --check public/js/player.js
          node --check public/js/player-core.js
          node --check backend-worker/src/worker.mjs
      - name: Run full application and Worker regression suite
        run: npm test
