name: Prepare MNHUT Cinema 3.57 release

on:
  push:
    branches: [main]
    paths:
      - scripts/rebuild-release.flag
      - .github/workflows/prepare-release-357.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prepare-phim4k-357-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create the draft before platform builders upload files
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view ios-v3.57 --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo 'Draft release already exists.'
          else
            gh release create ios-v3.57 \
              --repo "${GITHUB_REPOSITORY}" \
              --draft \
              --target "${GITHUB_SHA}" \
              --title 'MNHUT Cinema 3.57 - iOS, Android, Android TV, Windows' \
              --notes 'Sửa dứt điểm thanh điều khiển trên app: tự ẩn sau 2,6 giây, chạm màn hình để hiện lại rồi tự ẩn tiếp. Giữ duy nhất luồng phát ENSMovie và đồng bộ giao diện mới trên mọi thiết bị. iOS IPA chưa ký.'
          fi
          gh release view ios-v3.57 --repo "${GITHUB_REPOSITORY}" --json isDraft,tagName \
            --jq '{tag: .tagName, draft: .isDraft}'
